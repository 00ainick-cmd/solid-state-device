<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> CAET Flash Cards – Standalone </title>
  <style>
    :root{
      --bg: #f8fafc; /* slate-50 */
      --card: #ffffff;
      --text: #0f172a; /* slate-900 */
      --muted: #64748b; /* slate-500 */
      --border: #e2e8f0; /* slate-200 */
      --ring: #cbd5e1; /* slate-300 */
      --green: #16a34a; /* green-600 */
      --green-50: #ecfdf5;
      --yellow: #f59e0b; /* yellow-500 */
      --yellow-50: #fffbeb;
      --red: #dc2626; /* red-600 */
      --red-50: #fef2f2;
      --shadow: 0 10px 20px rgba(2, 6, 23, 0.06), 0 2px 6px rgba(2, 6, 23, 0.06);
    }
    html,body{height:100%}
    body{margin:0;background:linear-gradient(to bottom,var(--bg),#fff);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
    .container{max-width:1100px;margin:0 auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{margin:0;font-size:28px;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
    .sparkle{width:24px;height:24px}
    .deck-switch{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:6px;background:#fff;box-shadow:var(--shadow)}
    .chip{border:1px solid transparent;background:transparent;color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer}
    .chip.active{background:#111827;color:#fff}

    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
    .card h2{margin:0;padding:16px 20px;border-bottom:1px solid var(--border);font-size:18px}
    .card .content{padding:18px 20px}

    .flip{position:relative;height:300px;border-radius:16px;border:1px solid var(--border);background:#fff;cursor:pointer;user-select:none;perspective:1000px}
    .flip-inner{position:relative;height:100%;transform-style:preserve-3d;transition:transform .4s}
    .flip .face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;text-align:center}
    .flip .back{transform:rotateY(180deg)}
    .flip.is-flipped .flip-inner{transform:rotateY(180deg)}

    .meta{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .term{font-size:28px;font-weight:700;margin-top:6px}
    .unit{font-size:14px;color:var(--muted);margin-top:4px}
    .badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:12px;margin:4px 4px 0 0}

    .def{max-width:70ch;font-size:18px;line-height:1.4;max-height:180px;overflow:auto;padding-right:8px}

    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
    .btn{appearance:none;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
    .btn:focus{outline:2px solid var(--ring);outline-offset:2px}
    .btn-outline{background:#fff}
    .btn-primary{background:#111827;color:#fff;border-color:#111827}
    .btn-ghost{background:transparent}

    .btn-green{color:var(--green);border-color:#bbf7d0;background:var(--green-50)}
    .btn-green.active{background:var(--green);color:#fff;border-color:var(--green)}
    .btn-yellow{color:var(--yellow);border-color:#fef3c7;background:var(--yellow-50)}
    .btn-yellow.active{background:var(--yellow);color:#fff;border-color:var(--yellow)}
    .btn-red{color:var(--red);border-color:#fecaca;background:var(--red-50)}
    .btn-red.active{background:var(--red);color:#fff;border-color:var(--red)}

    .list{max-height:330px;overflow:auto;padding-right:6px}
    .list-item{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
    .list-item .title{font-weight:600}
    .list-item .line{color:var(--muted);font-size:12px;margin-top:6px}

    .bottom{margin-top:20px}
    .tags{display:flex;flex-wrap:wrap;gap:8px}
    .tag{border:1px solid var(--border);padding:6px 10px;border-radius:999px;background:#fff;cursor:pointer}
    .tag.active{background:#111827;color:#fff;border-color:#111827}

    .search{display:flex;align-items:center;gap:10px;margin-top:12px}
    .search input{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px}

    .empty{padding:28px;text-align:center;color:var(--muted)}

    @media (max-width:720px){
      header{flex-direction:column;align-items:flex-start;gap:12px}
      .row{flex-direction:column;align-items:stretch}
      .def{max-height:150px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <svg class="sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2l1.9 4.6L18 8l-4.1 1.4L12 14l-1.9-4.6L6 8l4.1-1.4L12 2z"/>
        </svg>
        Solid State Devices - Interactive Glossary
      </h1>
      <div class="deck-switch" id="deckSwitch">
        <button class="chip active" data-deck="all">All</button>
        <button class="chip" data-deck="easy">Easy <span class="count" data-count="easy"></span></button>
        <button class="chip" data-deck="medium">Medium <span class="count" data-count="medium"></span></button>
        <button class="chip" data-deck="difficult">Difficult <span class="count" data-count="difficult"></span></button>
      </div>
      <button class="btn btn-primary" id="finishSession" style="margin-top:8px;width:100%;max-width:200px;">Finish Session</button>
    </header>

    <section class="card">
      <h2>Study <span class="meta" style="margin-left:8px">[Space: Flip • ←/→: Prev/Next]</span></h2>
      <div class="content">
        <div class="flip" id="flip">
          <div class="flip-inner" id="flipInner">
            <div class="face front" id="front"></div>
            <div class="face back" id="back"></div>
          </div>
        </div>
        <div class="row">
          <div class="row" id="ratingRow">
            <button class="btn btn-green" id="rateEasy">Easy</button>
            <button class="btn btn-yellow" id="rateMedium">Medium</button>
            <button class="btn btn-red" id="rateDifficult">Difficult</button>
          </div>
          <div class="row">
            <button class="btn btn-outline" id="prev">Prev</button>
            <button class="btn btn-primary" id="next">Next ▶</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>List View</h2>
      <div class="content">
        <div class="list" id="list"></div>
      </div>
    </section>

    <section class="card bottom" style="margin-bottom:8px">
      <h2>Filter</h2>
      <div class="content">
        <div class="tags" id="tags"></div>
        <div class="search">
          <input id="search" type="search" placeholder="Search term, definition, unit, or tag" />
        </div>
      </div>
    </section>
  </div>

<script>
(function(){
  // ---------- Data (embedded directly – no document.write) ----------
  const FIXED_CARDS = [

  // === SEMICONDUCTOR FUNDAMENTALS ===
  {
    "term": "Semiconductor",
    "definition": "A material with electrical conductivity between a conductor and insulator. Silicon (Si) and germanium (Ge) are the most common semiconductors. Their conductivity can be precisely controlled through doping, making them ideal for solid state devices in avionics.",
    "analogy": "A gate that can be opened or closed to control electron flow.",
    "unit": "SSD 101",
    "tags": "fundamentals|materials|semiconductor_theory"
  },
  {
    "term": "P-type Semiconductor",
    "definition": "A semiconductor doped with acceptor atoms (like boron) that create holes (positive charge carriers). When boron is added to silicon, it creates a deficit of electrons, resulting in positive charge carriers that can conduct current.",
    "analogy": "Creating spaces where electrons want to jump into.",
    "unit": "SSD 101",
    "tags": "fundamentals|doping|semiconductor_theory"
  },
  {
    "term": "N-type Semiconductor",
    "definition": "A semiconductor doped with donor atoms (like phosphorus) that provide extra free electrons (negative charge carriers). The extra electrons make the material more conductive and negative.",
    "analogy": "Adding extra electrons like adding extra workers to a production line.",
    "unit": "SSD 101",
    "tags": "fundamentals|doping|semiconductor_theory"
  },
  {
    "term": "PN Junction",
    "definition": "The boundary between P-type and N-type semiconductor materials. At this junction, electrons and holes recombine, creating a depletion region that acts as a barrier. This is the fundamental building block of diodes and transistors.",
    "analogy": "A one-way valve that controls electron flow.",
    "unit": "SSD 101",
    "tags": "fundamentals|diodes|semiconductor_theory"
  },

  // === DIODES ===
  {
    "term": "Diode",
    "definition": "A two-terminal semiconductor device with a PN junction that allows current to flow in only one direction (forward bias) and blocks it in the opposite direction (reverse bias). Critical for rectification, protection, and signal processing in avionics.",
    "analogy": "An electrical one-way street or check valve for current.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|components|fundamentals"
  },
  {
    "term": "Anode",
    "definition": "The positive terminal of a diode, connected to the P-type material. Current flows into the diode through the anode when forward biased.",
    "analogy": "The entry point for conventional current flow.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|terminals"
  },
  {
    "term": "Cathode",
    "definition": "The negative terminal of a diode, connected to the N-type material. Usually marked with a band on the physical component. Current exits through the cathode.",
    "analogy": "The exit point for conventional current, marked for identification.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|terminals"
  },
  {
    "term": "Forward Bias",
    "definition": "Condition where the anode is positive relative to the cathode, allowing current to flow through the diode. Typical forward voltage drop is 0.7V for silicon diodes, 0.3V for germanium diodes.",
    "analogy": "Opening the gate to allow traffic through.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|operation"
  },
  {
    "term": "Reverse Bias",
    "definition": "Condition where the cathode is positive relative to the anode, blocking current flow through the diode. The depletion region widens, preventing conduction until breakdown voltage is reached.",
    "analogy": "Closing the gate to block traffic.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|operation"
  },
  {
    "term": "Forward Voltage Drop (Vf)",
    "definition": "The voltage across a diode when conducting in forward bias, typically 0.7V for silicon and 0.3V for germanium. This must be considered in circuit design for proper voltage calculations.",
    "analogy": "The admission price to pass through the gate.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|specifications|measurement"
  },
  {
    "term": "Peak Inverse Voltage (PIV)",
    "definition": "The maximum reverse voltage a diode can withstand without breaking down. Exceeding PIV can permanently damage the diode. Critical specification for power supply and protection circuits.",
    "analogy": "The maximum backward pressure before the gate breaks.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|specifications|safety"
  },
  {
    "term": "Rectifier Diode",
    "definition": "A diode designed to convert AC to DC by allowing current flow in only one direction. Used extensively in aircraft power supplies to convert AC generator output to DC for avionics equipment.",
    "analogy": "A one-way converter changing alternating flow to direct flow.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|applications|power_supplies"
  },
  {
    "term": "Light Emitting Diode (LED)",
    "definition": "A diode that emits light when forward biased as electrons recombine with holes. Used for indicators, displays, and lighting in modern aircraft panels. More efficient and longer-lasting than incandescent bulbs.",
    "analogy": "An electrical component that glows when current flows through it.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|applications|indicators"
  },
  {
    "term": "Diode Testing with Multimeter",
    "definition": "Use diode test mode or resistance mode with power OFF. Forward bias should show 0.5-0.8V (or low resistance ~500-1000Ω), reverse bias should show O.L. (open circuit). Both directions showing low resistance indicates a shorted diode.",
    "analogy": "Checking if the one-way valve works properly in both directions.",
    "unit": "SSD 102 - Diodes",
    "tags": "diodes|testing|troubleshooting"
  },

  // === ZENER DIODES ===
  {
    "term": "Zener Diode",
    "definition": "A special diode designed to operate in reverse breakdown at a specific voltage (Zener voltage). Used for voltage regulation and protection in avionics circuits. Unlike regular diodes, Zener diodes are designed to safely conduct in reverse.",
    "analogy": "A pressure relief valve that opens at a specific pressure.",
    "unit": "SSD 103 - Zener Diodes",
    "tags": "zener|voltage_regulation|components"
  },
  {
    "term": "Zener Voltage (Vz)",
    "definition": "The specific reverse breakdown voltage at which a Zener diode begins to conduct. Available in standard values from 2.4V to 200V. This voltage remains nearly constant despite changes in current.",
    "analogy": "The exact pressure at which the relief valve opens.",
    "unit": "SSD 103 - Zener Diodes",
    "tags": "zener|specifications"
  },
  {
    "term": "Zener Diode Operation",
    "definition": "Zener diodes are connected in reverse bias (cathode to positive). When voltage reaches Vz, the diode conducts and clamps the voltage to Vz. A series resistor limits current to prevent damage.",
    "analogy": "A controlled overflow valve that maintains constant pressure.",
    "unit": "SSD 103 - Zener Diodes",
    "tags": "zener|operation"
  },
  {
    "term": "Voltage Regulator Circuit",
    "definition": "A circuit using a Zener diode to maintain constant output voltage despite variations in input voltage or load current. Essential for protecting sensitive avionics from voltage spikes and fluctuations.",
    "analogy": "A governor that keeps output steady despite input changes.",
    "unit": "SSD 103 - Zener Diodes",
    "tags": "zener|applications|voltage_regulation"
  },
  {
    "term": "Zener Power Rating",
    "definition": "The maximum power (watts) a Zener diode can dissipate, calculated as P = Vz × Iz. Exceeding this rating will overheat and destroy the diode. Must be considered when sizing the series resistor.",
    "analogy": "The maximum heat the component can handle before failing.",
    "unit": "SSD 103 - Zener Diodes",
    "tags": "zener|specifications|safety"
  },

  // === TRANSISTORS ===
  {
    "term": "Transistor",
    "definition": "A three-terminal semiconductor device that can amplify current or act as an electronic switch. The two main types are Bipolar Junction Transistor (BJT) and Field Effect Transistor (FET). Fundamental building block of all modern avionics.",
    "analogy": "An electronic valve or relay controlled by a small signal.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|fundamentals|components"
  },
  {
    "term": "Bipolar Junction Transistor (BJT)",
    "definition": "A three-layer semiconductor device (NPN or PNP) with three terminals: base, collector, and emitter. A small base current controls a larger collector-emitter current. Used for amplification and switching.",

    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|fundamentals"
  },
  {
    "term": "NPN Transistor",
    "definition": "A BJT with N-type emitter and collector separated by a thin P-type base. Turns ON when base is positive relative to emitter. Conventional current flows from collector to emitter. Most common type in avionics.",
    "analogy": "A normally-off switch activated by positive signal.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|NPN"
  },
  {
    "term": "PNP Transistor",
    "definition": "A BJT with P-type emitter and collector separated by a thin N-type base. Turns ON when base is negative relative to emitter. Current flows from emitter to collector. Complementary to NPN.",
    "analogy": "A normally-off switch activated by negative signal.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|PNP"
  },
  {
    "term": "Base (B)",
    "definition": "The control terminal of a BJT. A small base current (typically μA to mA) controls the much larger collector current. The thin middle layer of the transistor structure.",
    "analogy": "The control knob that regulates the flow.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|terminals"
  },
  {
    "term": "Collector (C)",
    "definition": "The terminal where main current enters an NPN transistor (or exits a PNP). Connected to the more heavily doped region. Typically connected to the power supply through a load resistor.",
    "analogy": "The main inlet for the controlled flow.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|terminals"
  },
  {
    "term": "Emitter (E)",
    "definition": "The terminal where main current exits an NPN transistor (or enters a PNP). The reference point for transistor biasing. Usually connected to ground in NPN circuits.",
    "analogy": "The main outlet for the controlled flow.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|terminals"
  },
  {
    "term": "Beta (β) or hFE",
    "definition": "The current gain of a transistor, the ratio of collector current to base current: β = Ic/Ib. Typical values range from 50 to 300. Used to calculate base current needed for desired collector current.",
    "analogy": "The amplification factor - how much the small control signal is multiplied.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|specifications"
  },
  {
    "term": "Transistor Saturation",
    "definition": "The ON state where maximum collector current flows and collector-emitter voltage (Vce) is minimum (typically 0.2V). Used when transistor operates as a switch. Both junctions are forward biased.",
    "analogy": "Fully open valve with maximum flow.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|operation"
  },
  {
    "term": "Transistor Cutoff",
    "definition": "The OFF state where base current is zero, collector current is zero (except tiny leakage), and Vce equals supply voltage. Used for switching applications. Both junctions are reverse biased.",
    "analogy": "Fully closed valve with no flow.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|BJT|operation"
  },
  {
    "term": "Transistor as Switch",
    "definition": "Using a transistor to switch loads ON/OFF by driving it between saturation (ON) and cutoff (OFF). Common in digital circuits, relay drivers, and LED drivers in avionics. More efficient than using as amplifier.",
    "analogy": "An electronic relay controlled by low-power signal.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|applications|switching"
  },
  {
    "term": "Transistor as Amplifier",
    "definition": "Using a transistor in its active region to increase signal strength. Small changes in base current cause large changes in collector current. Used in audio, RF, and sensor circuits.",
    "analogy": "A megaphone that makes quiet signals loud.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|applications|amplification"
  },
  {
    "term": "Field Effect Transistor (FET)",
    "definition": "A voltage-controlled transistor with three terminals: gate, drain, and source. Unlike BJT which is current-controlled, FET is controlled by gate voltage. Very high input impedance, used extensively in modern avionics.",
    "analogy": "A valve controlled by electric field instead of current.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|FET|fundamentals"
  },
  {
    "term": "MOSFET",
    "definition": "Metal-Oxide-Semiconductor FET. Most common type of FET, with extremely high input impedance. Used in digital circuits, power control, and integrated circuits. Gate is insulated from channel by oxide layer.",
    "analogy": "A super-efficient switch with virtually no control power needed.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|FET|MOSFET"
  },
  {
    "term": "Transistor Testing",
    "definition": "Use diode test mode with power OFF. For NPN: base-emitter and base-collector should show ~0.6V forward, reverse shows O.L. For PNP: reverse these readings. Collector-emitter shows O.L. both ways if good.",
    "analogy": "Testing if the control valve operates correctly.",
    "unit": "SSD 104 - Transistors",
    "tags": "transistors|testing|troubleshooting"
  },

  // === INTEGRATED CIRCUITS (ICs) ===
  {
    "term": "Integrated Circuit (IC)",
    "definition": "A miniaturized electronic circuit consisting of thousands to billions of transistors, diodes, resistors, and capacitors on a single semiconductor chip. The foundation of modern avionics computers, autopilots, and digital systems.",
    "analogy": "An entire electronic factory on a silicon chip.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|fundamentals|components"
  },
  {
    "term": "Digital IC",
    "definition": "ICs that process discrete (on/off) signals using binary logic (0s and 1s). Includes logic gates, microprocessors, memory chips, and digital controllers. Used in flight computers and digital displays.",
    "analogy": "Electronic circuits that speak in yes/no, on/off language.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|digital|applications"
  },
  {
    "term": "Analog IC",
    "definition": "ICs that process continuous signals like voltage, current, temperature, or pressure. Includes operational amplifiers (op-amps), voltage regulators, and sensor interfaces. Critical for sensor processing in avionics.",
    "analogy": "Electronic circuits that handle smooth, continuous signals.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|analog|applications"
  },
  {
    "term": "Operational Amplifier (Op-Amp)",
    "definition": "A high-gain analog IC with differential inputs and single output. Used for signal amplification, filtering, and mathematical operations. Standard building block in sensor interfaces and signal conditioning.",
    "analogy": "A precision amplifier that can be configured for many tasks.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|analog|op-amp"
  },
  {
    "term": "Logic Gate",
    "definition": "Basic digital IC building block that performs Boolean operations (AND, OR, NOT, NAND, NOR, XOR). Multiple gates combine to create complex digital systems like processors and controllers.",
    "analogy": "Electronic decision maker with specific rules.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|digital|logic"
  },
  {
    "term": "Microcontroller",
    "definition": "A complete computer on a single IC chip, including processor, memory, and I/O peripherals. Used extensively in avionics for engine management, flight controls, and system monitoring. Examples: Arduino, PIC, ARM Cortex.",
    "analogy": "A tiny computer brain on a chip.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|digital|microcontrollers"
  },
  {
    "term": "Voltage Regulator IC",
    "definition": "An IC designed to maintain constant output voltage despite input variations. Common types: 7805 (+5V), 7812 (+12V), LM317 (adjustable). Essential for providing stable power to sensitive avionics circuits.",
    "analogy": "An automatic voltage stabilizer on a chip.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|analog|power_regulation"
  },
  {
    "term": "IC Package Types",
    "definition": "Physical formats for ICs: DIP (Dual Inline Package) for through-hole, SMD (Surface Mount Device) for compact boards, QFP (Quad Flat Pack), BGA (Ball Grid Array). Package type affects replacement and testing procedures.",
    "analogy": "Different container styles for the same electronic contents.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|packaging"
  },
  {
    "term": "IC Pin Numbering",
    "definition": "Standardized numbering system: Pin 1 marked with dot or notch, numbers increase counter-clockwise from top view. Critical for proper installation and troubleshooting. Incorrect installation can destroy the IC.",
    "analogy": "The addressing system for IC connections.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|identification|safety"
  },
  {
    "term": "IC Power Pins",
    "definition": "Vcc/Vdd (positive supply) and GND/Vss (ground) pins that power the IC. Must be connected correctly or IC will not function and may be damaged. Typically Vcc is highest pin number and GND is middle pin on DIP packages.",
    "analogy": "The power inlet and outlet for the chip.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|power|safety"
  },
  {
    "term": "Static Sensitive Devices",
    "definition": "ICs (especially CMOS and MOSFET-based) that can be damaged by electrostatic discharge (ESD). Require anti-static handling: wrist straps, grounded mats, anti-static bags. Even small static shocks can destroy these devices.",
    "analogy": "Delicate components that need special protective handling.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|safety|ESD"
  },
  {
    "term": "IC Troubleshooting",
    "definition": "Check power supply voltages first, verify proper pin connections, test with known-good IC if available, check for physical damage or overheating. Many ICs cannot be tested in-circuit and require replacement for diagnosis.",
    "analogy": "Systematic detective work to find the failing component.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|troubleshooting|testing"
  },
  {
    "term": "Heat Sink",
    "definition": "Metal device attached to power transistors and voltage regulator ICs to dissipate heat. Prevents thermal failure by increasing surface area for cooling. Required for components handling significant power.",
    "analogy": "A cooling fin that pulls heat away from hot components.",
    "unit": "SSD 105 - ICs",
    "tags": "ICs|thermal_management|safety"
  }
  ];

  function uidFrom(str){
    let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0 }
    return Math.abs(h).toString(36);
  }
  function normalizeTags(t){
    if(Array.isArray(t)) return t.map(s=>String(s).trim()).filter(Boolean);
    if(typeof t === 'string') return t.split(/[|,]/).map(s=>s.trim()).filter(Boolean);
    return [];
  }
  const DATA = FIXED_CARDS.map(c=>({ ...c, id: uidFrom(c.term+'::'+c.definition), tags: normalizeTags(c.tags) }));

  // ---------- Storage ----------
  const LS_KEY = 'glossary.mastery';
  function loadMap(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||{} }catch{ return {} } }
  function saveMap(m){ try{ localStorage.setItem(LS_KEY, JSON.stringify(m)) }catch{} }

  // ---------- SM-2 ----------
  const DAY = 24*60*60*1000;
  function scheduleNext(state, rating){
    const q = rating==='difficult'?2: rating==='medium'?4:5;
    let { reps=0, ivl=0, ease=2.5 } = state||{};
    const now = Date.now();
    if(q < 3){ reps=0; ivl=1; }
    else { if(reps===0) ivl=1; else if(reps===1) ivl=6; else ivl=Math.max(1, Math.round(ivl*ease)); reps+=1; }
    ease = Math.max(1.3, ease + 0.1 - (5-q)*(0.08 + (5-q)*0.02));
    const due = now + ivl*DAY;
    return { ...state, rating, reps, ivl, ease, due, last: now };
  }

  // ---------- State ----------
  const state = {
    mastery: loadMap(),
    deck: 'all',
    query: '',
    tags: new Set(),
    idx: 0,
    flipped: false
  };

  // ---------- Elements ----------
  const $front = document.getElementById('front');
  const $back = document.getElementById('back');
  const $flip = document.getElementById('flip');
  const $list = document.getElementById('list');
  const $tags = document.getElementById('tags');
  const $search = document.getElementById('search');
  const $prev = document.getElementById('prev');
  const $next = document.getElementById('next');
  const $rateEasy = document.getElementById('rateEasy');
  const $rateMedium = document.getElementById('rateMedium');
  const $rateDifficult = document.getElementById('rateDifficult');
  const $chips = Array.from(document.querySelectorAll('.deck-switch .chip'));
  const $counts = {
    easy: document.querySelector('[data-count="easy"]'),
    medium: document.querySelector('[data-count="medium"]'),
    difficult: document.querySelector('[data-count="difficult"]')
  };

  // ---------- Derived ----------
  function filtered(){
    const q = state.query.trim().toLowerCase();
    const base = DATA;
    const byQ = q ? base.filter(d => (d.term||'').toLowerCase().includes(q) || (d.definition||'').toLowerCase().includes(q) || (d.unit||'').toLowerCase().includes(q) || (d.tags||[]).some(t=>t.toLowerCase().includes(q))) : base;
    const byTags = state.tags.size ? byQ.filter(d => (d.tags||[]).some(t=>state.tags.has(t))) : byQ;
    const byDeck = state.deck==='all' ? byTags : byTags.filter(d => (state.mastery[d.id]?.rating||'medium') === state.deck);
    return byDeck;
  }

  function computeTagIndex(){
    const counts = {};
    DATA.forEach(it => (it.tags||[]).forEach(t => { if(!t) return; counts[t]=(counts[t]||0)+1; }));
    return Object.entries(counts).sort((a,b)=> b[1]-a[1] || String(a[0]).localeCompare(String(b[0])));
  }

  function computeCounts(){
    const easy = DATA.filter(d => (state.mastery[d.id]?.rating||'medium')==='easy').length;
    const med  = DATA.filter(d => (state.mastery[d.id]?.rating||'medium')==='medium').length;
    const dif  = DATA.filter(d => (state.mastery[d.id]?.rating||'medium')==='difficult').length;
    $counts.easy.textContent = `(${easy})`;
    $counts.medium.textContent = `(${med})`;
    $counts.difficult.textContent = `(${dif})`;
  }

  // ---------- Render ----------
  function renderCard(){
    const items = filtered();
    if(items.length===0){
      $front.innerHTML = `<div class="empty">No terms match your search or selected tags.</div>`;
      $back.innerHTML = '';
      return;
    }
    if(state.idx >= items.length) state.idx = 0;
    const cur = items[state.idx];
    const rating = (state.mastery[cur.id]?.rating)||'medium';
    $front.innerHTML = `
      <div>
        <div class="meta">Term</div>
        <div class="term">${escapeHTML(cur.term)}</div>
        <div class="unit">${escapeHTML(cur.unit||'')}</div>
        <div style="margin-top:8px">${(cur.tags||[]).map(t=>`<span class="badge">${escapeHTML(t)}</span>`).join('')}</div>
      </div>`;
    $back.innerHTML = `
      <div>
        <div class="meta">Definition</div>
        <div class="def">${escapeHTML(cur.definition)}</div>
      </div>`;

    setActive($rateEasy, rating==='easy');
    setActive($rateMedium, rating==='medium');
    setActive($rateDifficult, rating==='difficult');
  }

  function renderList(){
    const items = filtered();
    if(items.length===0){ $list.innerHTML = `<div class="empty">No terms match your search or selected tags.</div>`; return; }
    $list.innerHTML = items.map(it=>{
      const r = (state.mastery[it.id]?.rating)||'medium';
      const color = r==='easy' ? 'background:var(--green);color:#fff' : r==='medium' ? 'background:var(--yellow);color:#fff' : 'background:var(--red);color:#fff';
      return `<div class="list-item">
        <div class="title">${escapeHTML(it.term)}</div>
        <div class="line">${escapeHTML(it.definition)}</div>
        <div class="line">${escapeHTML(it.unit||'')}${(it.tags||[]).length?' • ':''}${(it.tags||[]).map(escapeHTML).join(', ')}</div>
        <div class="line"><span class="badge" style="${color}">${r[0].toUpperCase()+r.slice(1)}</span></div>
      </div>`
    }).join('');
  }

  function renderTags(){
    const idx = computeTagIndex();
    $tags.innerHTML = idx.slice(0,24).map(([tag,count])=>{
      const active = state.tags.has(tag);
      return `<button class="tag ${active?'active':''}" data-tag="${encodeURIComponent(tag)}">${escapeHTML(tag)} <span style="opacity:.7">(${count})</span></button>`;
    }).join('') + (state.tags.size? ' <button class="tag" id="clearTags">Clear</button>': '');
  }

  function renderAll(){
    computeCounts();
    renderCard();
    renderList();
    renderTags();
  }

  // ---------- Utils ----------
  function setActive(btn, on){
    const classes = btn.className.split(' ').filter(Boolean);
    const has = classes.includes('active');
    if(on && !has) btn.className += ' active';
    if(!on && has) btn.className = classes.filter(c=>c!=='active').join(' ');
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
  }

  // ---------- Events ----------
  $flip.addEventListener('click', ()=>{ state.flipped=!state.flipped; $flip.classList.toggle('is-flipped', state.flipped); });
  $prev.addEventListener('click', ()=>{ const len=filtered().length||1; state.flipped=false; state.idx=(state.idx-1+len)%len; renderCard(); });
  $next.addEventListener('click', ()=>{ const len=filtered().length||1; state.flipped=false; state.idx=(state.idx+1)%len; renderCard(); });

  $rateEasy.addEventListener('click', ()=>rate('easy'));
  $rateMedium.addEventListener('click', ()=>rate('medium'));
  $rateDifficult.addEventListener('click', ()=>rate('difficult'));

  $chips.forEach(ch=> ch.addEventListener('click', ()=>{
    $chips.forEach(b=>b.classList.remove('active'));
    ch.classList.add('active');
    state.deck = ch.dataset.deck;
    state.idx = 0; state.flipped=false; $flip.classList.remove('is-flipped');
    renderAll();
  }));

  $tags.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-tag]');
    if(t){
      const tag = decodeURIComponent(t.getAttribute('data-tag'));
      if(state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
      state.idx=0; state.flipped=false; $flip.classList.remove('is-flipped');
      renderAll();
    }
    if(e.target && e.target.id==='clearTags'){ state.tags.clear(); renderAll(); }
  });

  $search.addEventListener('input', ()=>{ state.query = $search.value; state.idx=0; renderAll(); });

  window.addEventListener('keydown', (e)=>{
    const tag = (e.target && e.target.tagName||'').toLowerCase();
    if(tag==='input' || tag==='textarea') return;
    if(e.code==='ArrowLeft'){ e.preventDefault(); $prev.click(); }
    if(e.code==='ArrowRight'){ e.preventDefault(); $next.click(); }
    if(e.code==='Space'){ e.preventDefault(); $flip.click(); }
  });

  function rate(level){
    const items = filtered(); if(items.length===0) return;
    const cur = items[state.idx];
    const st = state.mastery[cur.id] || { rating:'medium', seen:0, correct:0, last:0, reps:0, ivl:0, ease:2.5, due:0 };
    const next = scheduleNext(st, level);
    state.mastery[cur.id] = next; saveMap(state.mastery);
    computeCounts();
    $next.click();
  }

  // ---------- Init ----------
  DATA.forEach(it=>{ if(!state.mastery[it.id]) state.mastery[it.id] = { rating:'medium', seen:0, correct:0, last:0, reps:0, ivl:0, ease:2.5, due:0 }; });
  saveMap(state.mastery);
  renderAll();

  // ---------- Finish Session & Report to Parent ----------
  function finishSession() {
    // Calculate score based on mastery ratings
    const total = DATA.length;
    const easy = DATA.filter(d => (state.mastery[d.id]?.rating||'medium')==='easy').length;
    const medium = DATA.filter(d => (state.mastery[d.id]?.rating||'medium')==='medium').length;
    const difficult = DATA.filter(d => (state.mastery[d.id]?.rating||'medium')==='difficult').length;

    // Score: easy cards = 100%, medium = 50%, difficult = 0%
    const score = Math.round((easy + medium * 0.5) / total * 100);

    // Try to send to parent page
    try {
      if (window.parent && window.parent.completeModule) {
        console.log('✅ Sending flashcards score to parent page:', score + '%');
        window.parent.completeModule('flashcards', score);

        alert(`📚 Study Session Complete!\n\nYour Progress:\n✅ Easy: ${easy} cards\n⚠️ Medium: ${medium} cards\n❌ Difficult: ${difficult} cards\n\n📊 Score: ${score}%\n\nKeep studying to improve!`);

        // Return to home view after 1 second
        setTimeout(() => {
          if (window.parent && window.parent.showTab) {
            window.parent.showTab('home');
          }
        }, 1000);
      } else {
        console.log('⚠️ Parent page not available - running standalone');
        alert(`📚 Study Session Complete!\n\nYour Progress:\n✅ Easy: ${easy} cards\n⚠️ Medium: ${medium} cards\n❌ Difficult: ${difficult} cards\n\n📊 Score: ${score}%\n\n(Gamification not available in standalone mode)`);
      }
    } catch (e) {
      console.error('Error communicating with parent page:', e);
      alert(`📚 Study Session Complete!\n\nScore: ${score}%\nEasy: ${easy}, Medium: ${medium}, Difficult: ${difficult}`);
    }
  }

  // Attach finish session button handler
  const $finishBtn = document.getElementById('finishSession');
  if ($finishBtn) {
    $finishBtn.addEventListener('click', finishSession);
  }

  // ---------- Lightweight tests (no special chars) ----------
  ;(function runTests(){
    try{
      if(!(Array.isArray(DATA) && DATA.length>0)) console.error('Test failed: dataset missing');
      const total = DATA.length;
      const counts = ['easy','medium','difficult'].map(k=> DATA.filter(d => (state.mastery[d.id]?.rating||'medium')===k).length).reduce((a,b)=>a+b,0);
      if(!(counts<=total)) console.error('Test failed: deck counts');
    }catch(e){ console.error('Self-test error', e); }
  })();
})();
</script>
</body>
</html>
